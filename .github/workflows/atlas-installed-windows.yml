name: IWXA Atlas installed Windows lifecycle acceptance

on:
  push:
    branches:
      - work/2026-11-02-atlas-desktop-0.2
    paths:
      - 'desktop/tests/installed-webview2.mjs'
      - '.github/workflows/atlas-installed-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-ui-accept]')
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated UI test driver
        working-directory: desktop
        shell: pwsh
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Download previously qualified NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          run-id: 41446391609
          github-token: ${{ github.token }}
          path: desktop/qualified-installer
      - name: Install Atlas into this Windows user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem desktop/qualified-installer -Filter '*.exe' -Recurse | Select-Object -First 1
          if (!$installer) { throw "Qualified Atlas NSIS installer not found" }
          Write-Output "ATLAS_INSTALL_START $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          try {
            $process | Wait-Process -Timeout 100 -ErrorAction Stop
          } catch {
            Write-Output "ATLAS_INSTALL_TIMEOUT - collecting process diagnostics"
            Get-Process -Name '*atlas*','*setup*' -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Output
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            throw "NSIS installer did not exit within 100 seconds; installation HOLD"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          Write-Output "ATLAS_NSIS_INSTALLER_EXIT_0"
          $uninstallPaths = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $entries = @(Get-ItemProperty -Path $uninstallPaths -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*IWXA Atlas*' })
          $entries | Select-Object DisplayName,InstallLocation,DisplayIcon | Format-Table | Out-String | Write-Output
          $roots = @("$env:LOCALAPPDATA\Programs\IWXA Atlas","$env:LOCALAPPDATA\IWXA Atlas",
            "$env:ProgramFiles\IWXA Atlas","${env:ProgramFiles(x86)}\IWXA Atlas") +
            @($entries | ForEach-Object { $_.InstallLocation })
          $candidate = foreach ($root in ($roots | Where-Object { $_ } | Select-Object -Unique)) {
            if (Test-Path -LiteralPath $root) {
              Get-ChildItem -LiteralPath $root -Depth 3 -Filter 'iwxa-atlas-desktop.exe' -File -ErrorAction SilentlyContinue
            }
          }
          $app = @($candidate) | Select-Object -First 1
          if (!$app) { throw "NSIS succeeded but installed executable missing from installation directories" }
          "ATLAS_INSTALLED_EXE=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "ATLAS_NSIS_INSTALL_PASS path=$($app.FullName)"
      - name: Test real installed WebView2 lifecycle
        shell: pwsh
        run: node desktop/tests/installed-webview2.mjs
      - name: Retain screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-02-installed-windows-visual-acceptance
          path: desktop/test-artifacts/*
          if-no-files-found: ignore
          retention-days: 3
