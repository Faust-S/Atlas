name: IWXA Atlas installed Windows lifecycle acceptance

on:
  push:
    branches:
      - work/2026-11-02-atlas-desktop-0.2
    paths:
      - 'desktop/tests/installed-webview2.mjs'
      - '.github/workflows/atlas-installed-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-ui-accept]')
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated UI test driver
        working-directory: desktop
        shell: pwsh
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Download previously qualified NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          run-id: 41446391609
          github-token: ${{ github.token }}
          path: desktop/qualified-installer
      - name: Install Atlas into this Windows user
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/qualified-installer -Filter '*.exe' -Recurse | Select-Object -First 1
          if (!$installer) { throw "Qualified Atlas NSIS installer not found" }
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "NSIS installation failed: $($result.ExitCode)" }
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:LOCALAPPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $installed = foreach ($root in $roots) {
            if ((Test-Path $root) -and $root) {
              Get-ChildItem -Path $root -Filter 'iwxa-atlas-desktop.exe' -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch 'WebView|cache' }
            }
          }
          $app = @($installed) | Select-Object -First 1
          if (!$app) { throw "NSIS exited 0 but installed Atlas executable cannot be located" }
          "ATLAS_INSTALLED_EXE=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "ATLAS_NSIS_INSTALL_PASS path=$($app.FullName)"
      - name: Test real installed WebView2 lifecycle
        shell: pwsh
        run: node desktop/tests/installed-webview2.mjs
      - name: Retain screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-02-installed-windows-visual-acceptance
          path: desktop/test-artifacts/*
          if-no-files-found: ignore
          retention-days: 3
