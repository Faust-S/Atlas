name: IWXA Atlas 0.12.1-dev.1 Windows development qualification

on:
  push:
    branches:
      - work/2026-11-22-atlas-0-11-baseline
      - work/2026-11-23-atlas-0-12-plan-readiness
      - work/2026-11-24-atlas-plan-revision
    paths:
      - '.github/workflows/atlas-0-11-v6-windows.yml'
      - 'desktop/tests/installed-atlas11-v6-design.py'
      - 'desktop/src/main.tsx'
      - 'desktop/src/AtlasChrome.tsx'
      - 'desktop/src/AtlasDashboard.tsx'
      - 'desktop/src/AtlasSettings.tsx'
      - 'desktop/src/AtlasInspectorPreview.tsx'
      - 'desktop/src/ProjectOrganizationGuide.tsx'
      - 'desktop/src/ResourceAlternatives.tsx'
      - 'desktop/src/PlanAlternativesComparison.tsx'
      - 'desktop/src/PlanRecoveryComparison.tsx'
      - 'desktop/src/PortfolioPlanSets.tsx'
      - 'desktop/src/inspector-work-context.mjs'
      - 'desktop/src/style.css'
      - 'desktop/index.html'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/installer/**'
      - 'desktop/src-tauri/**'
      - 'desktop/tests/installed-atlas11-*.py'
      - 'desktop/tests/installed-atlas12-*.py'
      - 'desktop/tests/installed-atlas-plan-amendment-review.py'
      - 'tests/atlas-plan-amendment-review.test.mjs'
      - 'tests/fixtures/**'
      - 'tests/verify-atlas09-host-dist.mjs'
      - 'tests/atlas11-*.test.mjs'
      - 'tests/atlas12-*.test.mjs'
      - 'src/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: atlas11-v6-native-${{ github.ref }}
  # Preserve a native acceptance already running on the previous revision.
  cancel-in-progress: false

jobs:
  installed-native-ui:
    runs-on: windows-latest
    timeout-minutes: 96
    steps:
      - name: Checkout exact Atlas 0.12 source revision
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up original Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the real Atlas Tauri Windows program
        shell: pwsh
        working-directory: desktop
        timeout-minutes: 18
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NPM_CI_FAILED' }
          npm run desktop:build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_TAURI_BUILD_FAILED' }

      - name: Verify original T3 packaged in one dist
        shell: pwsh
        run: |
          node tests/verify-atlas09-host-dist.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_ORIGINAL_HOST_DIST_FAILED' }

      - name: Verify original Rust Native Store and persisted readback
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS12_NATIVE_RUST_REGRESSION' }

      - name: Checkout original qualified IWXA Setup Core
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 0ef7544e2a6fd5fab5994f7f25abbb960063908c
          path: setup-core-source
          persist-credentials: false

      - name: Build and install native Atlas through original Setup Core
        shell: pwsh
        timeout-minutes: 9
        run: |
          $ErrorActionPreference = 'Stop'
          ./desktop/installer/build-setup-core.ps1 -InstallForQualification
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_SETUP_FAILED' }

      - name: Preserve built candidate for diagnosis (not accepted)
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-0.12-unqualified-candidate-${{ github.sha }}
          path: |
            artifacts/IWXA-Atlas-0.12.1-dev.1-Setup.exe
            artifacts/IWXA-Atlas-0.12.1-dev.1-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prepare real 1212 Work user-path IWXA package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas11-v6-1212-work.iwxa'
          node tests/fixtures/atlas06-visual-portfolio.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS11_NATIVE_FIXTURE_FAILED'
          }
          "ATLAS06_VISUAL_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare existing two-project calendar IWXA package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas11-portfolio-work-impact.iwxa'
          node tests/fixtures/atlas10-portfolio-forecast.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS11_NATIVE_PORTFOLIO_FIXTURE_FAILED'
          }
          "ATLAS11_PORTFOLIO_IMPACT_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare independent Atlas 0.12 resource alternative IWXA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas12-resource-options.iwxa'
          node tests/fixtures/atlas12-resource-alternatives.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS12_RESOURCE_OPTIONS_FIXTURE_FAILED'
          }
          "ATLAS12_RESOURCE_ALTERNATIVES_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare independent multi-Work amendment IWXA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas12-plan-alternatives.iwxa'
          node tests/fixtures/atlas12-plan-alternatives.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS12_PLAN_ALTERNATIVES_FIXTURE_FAILED'
          }
          "ATLAS12_PLAN_ALTERNATIVES_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare independently imported stale proposal IWXA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas-plan-amendment-review.iwxa'
          node tests/fixtures/atlas-plan-amendment-review.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS_PLAN_REVIEW_FIXTURE_FAILED'
          }
          "ATLAS_PLAN_REVIEW_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare independent coordinated four-project IWXA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas12-portfolio-plan-sets.iwxa'
          node tests/fixtures/atlas12-portfolio-plan-sets.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS12_PORTFOLIO_PLAN_SET_FIXTURE_FAILED'
          }
          "ATLAS12_PORTFOLIO_PLAN_SETS_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Qualify installed native UI with Windows accessibility API
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pywinauto==0.6.9 pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_UIA_MISSING' }
          python -m py_compile desktop/tests/installed-atlas11-v6-design.py desktop/tests/installed-atlas11-portfolio-impact.py desktop/tests/installed-atlas12-resource-alternatives.py desktop/tests/installed-atlas12-plan-alternatives.py desktop/tests/installed-atlas-plan-amendment-review.py desktop/tests/installed-atlas12-plan-recovery.py desktop/tests/installed-atlas12-portfolio-plan-sets.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_SCRIPT_SYNTAX' }
          python desktop/tests/installed-atlas11-v6-design.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_V6_USER_ROUTE_FAIL' }
          python desktop/tests/installed-atlas11-portfolio-impact.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_PORTFOLIO_IMPACT_FAIL' }

      # Collect independent evidence from both routes on the same exact build.
      # A failing resource scenario must not hide a separate compound scenario.
      # The final gate below still rejects either failed qualification.
      - name: Qualify resource choices and dependency routes
        id: resource_qualification
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          python desktop/tests/installed-atlas12-resource-alternatives.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS12_NATIVE_RESOURCE_ALTERNATIVES_FAIL' }

      - name: Qualify multi-Work scenarios, approved plan application and cold restore
        id: compound_qualification
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          python desktop/tests/installed-atlas12-plan-alternatives.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS12_NATIVE_PLAN_ALTERNATIVES_FAIL' }

      - name: Qualify stale proposal review and explicit application
        id: review_qualification
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          python desktop/tests/installed-atlas-plan-amendment-review.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_NATIVE_PLAN_REVIEW_FAIL' }

      - name: Qualify recovery alternatives and ordinary proposal application
        id: recovery_qualification
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          python desktop/tests/installed-atlas12-plan-recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS12_NATIVE_PLAN_RECOVERY_FAIL' }

      - name: Qualify coordinated portfolio comparison, separate approval and atomic application
        id: coordinated_qualification
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 16
        run: |
          $ErrorActionPreference = 'Stop'
          python desktop/tests/installed-atlas12-portfolio-plan-sets.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS12_NATIVE_PORTFOLIO_PLAN_SET_FAIL' }

      - name: Require all independent native qualifications
        shell: pwsh
        env:
          RESOURCE_OUTCOME: ${{ steps.resource_qualification.outcome }}
          COMPOUND_OUTCOME: ${{ steps.compound_qualification.outcome }}
          REVIEW_OUTCOME: ${{ steps.review_qualification.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery_qualification.outcome }}
          COORDINATED_OUTCOME: ${{ steps.coordinated_qualification.outcome }}
        run: |
          if ($env:RESOURCE_OUTCOME -ne 'success' -or $env:COMPOUND_OUTCOME -ne 'success' -or $env:REVIEW_OUTCOME -ne 'success' -or $env:RECOVERY_OUTCOME -ne 'success' -or $env:COORDINATED_OUTCOME -ne 'success') {
            throw "ATLAS12_NATIVE_HOLD resource=$env:RESOURCE_OUTCOME compound=$env:COMPOUND_OUTCOME review=$env:REVIEW_OUTCOME recovery=$env:RECOVERY_OUTCOME coordinated=$env:COORDINATED_OUTCOME"
          }
          Write-Host 'ATLAS12_NATIVE_RESOURCE_AND_COMPOUND_PASS'
          Write-Host 'ATLAS_NATIVE_PLAN_REVIEW_PASS'
          Write-Host 'ATLAS12_NATIVE_PLAN_RECOVERY_PASS'
          Write-Host 'ATLAS12_NATIVE_PORTFOLIO_PLAN_SET_PASS'

      - name: Preserve accepted development installer and SHA-256
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IWXA-Atlas-0.12.1-dev.1-Setup
          path: |
            artifacts/IWXA-Atlas-0.12.1-dev.1-Setup.exe
            artifacts/IWXA-Atlas-0.12.1-dev.1-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload installed Atlas UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas11-v6-native-evidence-${{ github.run_id }}
          path: desktop/tests/visual-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
