name: IWXA Atlas 0.11 original Windows v6 installed UI qualification

on:
  push:
    branches:
      - work/2026-11-22-atlas-0-11-baseline
      - work/2026-11-23-atlas-0-12-plan-readiness
    paths:
      - '.github/workflows/atlas-0-11-v6-windows.yml'
      - 'desktop/tests/installed-atlas11-v6-design.py'
      - 'desktop/src/main.tsx'
      - 'desktop/src/AtlasChrome.tsx'
      - 'desktop/src/AtlasDashboard.tsx'
      - 'desktop/src/AtlasSettings.tsx'
      - 'desktop/src/AtlasInspectorPreview.tsx'
      - 'desktop/src/ProjectOrganizationGuide.tsx'
      - 'desktop/src/inspector-work-context.mjs'
      - 'desktop/src/style.css'
      - 'desktop/index.html'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/installer/**'
      - 'desktop/src-tauri/**'
      - 'desktop/tests/installed-atlas11-*.py'
      - 'tests/fixtures/**'
      - 'tests/verify-atlas09-host-dist.mjs'
      - 'tests/atlas11-*.test.mjs'
      - 'tests/atlas12-*.test.mjs'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas11-v6-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-native-ui:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact Atlas 0.11 source revision
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up original Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the real Atlas Tauri Windows program
        shell: pwsh
        working-directory: desktop
        timeout-minutes: 18
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NPM_CI_FAILED' }
          npm run desktop:build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_TAURI_BUILD_FAILED' }

      - name: Verify original T3 packaged in one dist
        shell: pwsh
        run: |
          node tests/verify-atlas09-host-dist.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_ORIGINAL_HOST_DIST_FAILED' }

      - name: Checkout original qualified IWXA Setup Core
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 0ef7544e2a6fd5fab5994f7f25abbb960063908c
          path: setup-core-source
          persist-credentials: false

      - name: Build and install native Atlas through original Setup Core
        shell: pwsh
        timeout-minutes: 9
        run: |
          $ErrorActionPreference = 'Stop'
          ./desktop/installer/build-setup-core.ps1 -InstallForQualification
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_SETUP_FAILED' }

      - name: Prepare real 1212 Work user-path IWXA package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas11-v6-1212-work.iwxa'
          node tests/fixtures/atlas06-visual-portfolio.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS11_NATIVE_FIXTURE_FAILED'
          }
          "ATLAS06_VISUAL_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare existing two-project calendar IWXA package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas11-portfolio-work-impact.iwxa'
          node tests/fixtures/atlas10-portfolio-forecast.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) {
            throw 'ATLAS11_NATIVE_PORTFOLIO_FIXTURE_FAILED'
          }
          "ATLAS11_PORTFOLIO_IMPACT_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Qualify installed native UI with Windows accessibility API
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pywinauto==0.6.9 pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_UIA_MISSING' }
          python -m py_compile desktop/tests/installed-atlas11-v6-design.py desktop/tests/installed-atlas11-portfolio-impact.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_SCRIPT_SYNTAX' }
          python desktop/tests/installed-atlas11-v6-design.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_V6_USER_ROUTE_FAIL' }
          python desktop/tests/installed-atlas11-portfolio-impact.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS11_NATIVE_PORTFOLIO_IMPACT_FAIL' }

      - name: Preserve accepted development installer and SHA-256
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IWXA-Atlas-0.11.0-dev.1-Setup
          path: |
            artifacts/IWXA-Atlas-0.11.0-dev.1-Setup.exe
            artifacts/IWXA-Atlas-0.11.0-dev.1-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installed Atlas UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas11-v6-native-evidence-${{ github.run_id }}
          path: desktop/tests/visual-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
