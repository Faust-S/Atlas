name: Verified native software screenshot for IWXA site
on:
  push:
    branches:
      - qa/2026-11-19-site-verified-atlas09
    paths:
      - .github/workflows/qa-current-screenshot.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  transfer-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact new Windows screenshot artifact
        uses: actions/download-artifact@v4
        with:
          repository: Faust-S/Atlas
          run-id: 44612742339
          name: atlas09-installed-windows-evidence
          path: ${{ runner.temp }}/native-screen
          github-token: ${{ github.token }}
      - name: Convert verified native screenshot into compact public WebP
        shell: bash
        env:
          ORIGINAL_OWNER_SHA: 19ea3d228c585a1c50e749632c2f2df1a71c7c33
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image
          artifact=Path(os.environ['RUNNER_TEMP'])/'native-screen'/"atlas06-connect-visual-atlas09-installed-readback-and-version.png"
          expected="123a5819233089cc8a313a81b10c83709dc36a9e08a153c2ca0e33f9f5bcdfe5"
          raw=artifact.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==expected, 'SOURCE_SCREENSHOT_HASH_MISMATCH'
          image=Image.open(artifact).convert('RGB')
          assert image.size==(1024,768), 'SCREEN_GEOMETRY_NOT_CURRENT'
          image=image.crop((8,0,812,644))
          target=Path('qa-verified-software-screens')/"atlas09-current-verified.webp"
          target.parent.mkdir(parents=True,exist_ok=True)
          image.save(target,format='WEBP',quality=79,method=6)
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          manifest={
             'schema':'IWXA_AUTHENTIC_WINDOWS_SCREENSHOT/1',
             'product':"Atlas 0.9 Windows installed",
             'product_owner_sha':os.environ['ORIGINAL_OWNER_SHA'],
             'windows_run':44612742339,
             'original_image_sha256':expected,
             'webp_image_sha256':digest,
             'width':image.width,'height':image.height,
             'source_path':"atlas06-connect-visual-atlas09-installed-readback-and-version.png",
             'captured_from':'genuine installed Windows GUI, no generation',
             'modification':'crop real native window bounds; WebP encode only',
          }
          Path('qa-verified-software-screens/manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('IWXA_VERIFIED_NATIVE_IMAGE', digest, image.size)
          PY
      - name: Publish independently reproducible screenshot bytes on QA branch
        shell: bash
        run: |
          git config user.name 'IWXA QA'
          git config user.email 'iwxa-qa@users.noreply.github.com'
          git add qa-verified-software-screens/
          git commit -m 'evidence: retain exact current Windows screenshot for site review [skip ci]'
          git push origin HEAD:qa/2026-11-19-site-verified-atlas09
