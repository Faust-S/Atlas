name: IWXA Atlas Windows UIA fast preflight

on:
  push:
    branches:
      - work/2026-11-02-atlas-desktop-0.2
    paths:
      - 'desktop/tests/installed-windows-uia.py'
      - '.github/workflows/atlas-windows-uia-preflight.yml'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[uia-preflight]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: UI automation outside application
        run: python -m pip install --disable-pip-version-check pywinauto==0.6.9 pillow
      - name: Download previously qualified installer
        uses: actions/download-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          run-id: 41446391609
          github-token: ${{ github.token }}
          path: desktop/qualified-installer
      - name: Install existing binary for test-driver preflight
        shell: pwsh
        run: |
          $exe=Get-ChildItem desktop/qualified-installer -Filter '*.exe' -Recurse | Select-Object -First 1
          if (!$exe) {throw "Missing known-good NSIS candidate"}
          $p=Start-Process -FilePath $exe.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) {throw "NSIS install failed"}
          $path=Join-Path $env:LOCALAPPDATA 'IWXA Atlas\iwxa-atlas-desktop.exe'
          if (!(Test-Path $path)) {throw "Installed EXE missing"}
          "ATLAS_INSTALLED_EXE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise project save, restart and task readback
        shell: pwsh
        env:
          ATLAS_CI_EXPECT_BRIDGE: '0'
        run: python desktop/tests/installed-windows-uia.py
      - name: Preserve GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-windows-uia-driver-preflight
          path: desktop/test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 3
