name: Atlas public branch qualification (fast push / gated cross-OS browser)

on:
  push:
    branches:
      - work/2026-11-01-atlas-foundation
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/public-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run actual Node tests and syntax checks
        shell: bash
        run: |
          npm test
          for source in src/*.mjs; do node --check "$source"; done
          node --check tests/ci-browser.mjs

  browser-linux:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser-accept]')
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver for CI only
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium with Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Linux real-browser acceptance
        run: node tests/ci-browser.mjs
      - name: Store only failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-linux-failure
          path: atlas-ci-*-failure.png
          if-no-files-found: ignore
          retention-days: 3

  browser-cross-os:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser-accept]')
    needs: browser-linux
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver for CI only
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run cross-OS real-browser acceptance
        run: node tests/ci-browser.mjs
      - name: Store only failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-${{ matrix.os }}-failure
          path: atlas-ci-*-failure.png
          if-no-files-found: ignore
          retention-days: 3

  scale-public-linux:
    if: contains(github.event.head_commit.message, '[scale-accept]')
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live public repositories without private data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/ci-public-sources.mjs
      - name: Install CI-only Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stress actual Chromium, IndexedDB and portfolio interface
        run: node tests/ci-scale-browser.mjs
      - name: Retain failure screenshot only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-scale-linux-failure
          path: atlas-scale-browser-failure.png
          if-no-files-found: ignore
          retention-days: 3
