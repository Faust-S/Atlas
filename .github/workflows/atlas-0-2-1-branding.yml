name: IWXA Atlas installed Windows qualification

on:
  push:
    branches:
      - work/2026-11-04-atlas-0-2-1-branding
      - work/2026-11-04-atlas-0-3
      - work/2026-11-08-atlas-0-4
      - release/0.4
      - work/2026-11-09-atlas-0-5
      - work/2026-11-10-atlas-0-6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-021-branding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: github.ref_name == 'work/2026-11-04-atlas-0-2-1-branding' || github.ref_name == 'release/0.4' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-accept]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned React dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Compile installed IWXA Windows acceptance driver
        run: python -m py_compile desktop/tests/installed-atlas05-iwxa.py
      - name: Test existing Atlas and branded icon
        run: npm test
      - name: Independently inspect IWXA ZIP carrier with Python
        run: node tests/iwxa-python-carrier.mjs
      - name: Build branded production GUI
        working-directory: desktop
        run: npm run build
      - name: Checkout exact public Center 0.3 read-only consumer
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 0fad3fb13245b87fefc54ddc5fdf3835004d23c0
          path: center-public
          persist-credentials: false
      - name: Checkout Center-pinned canonical Atlas source (no fork)
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 0de3b6058526021aeecee6f445acf89b956d10c9
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Install exact Center-pinned Atlas IWXA reader
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        working-directory: center-public/vendor/atlas/desktop
        run: npm ci --no-audit --no-fund
      - name: Read IWXA through real Center 0.3 source consumer
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        run: node tests/atlas05-center-iwxa-consumer.mjs
  windows-installer:
    permissions:
      contents: write
    runs-on: windows-latest
    needs: frontend
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Atlas and bundle NSIS only for versions before 0.5
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($env:GITHUB_REF_NAME -in @('work/2026-11-09-atlas-0-5','work/2026-11-10-atlas-0-6')) {
            npm run desktop:build -- --no-bundle
          } else {
            npm run desktop:build
          }
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_NATIVE_BUILD_FAILED' }
      - name: Checkout original pinned IWXA Setup Core
        if: github.ref_name == 'work/2026-11-09-atlas-0-5' || github.ref_name == 'work/2026-11-10-atlas-0-6'
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 0ef7544e2a6fd5fab5994f7f25abbb960063908c
          path: setup-core-source
          persist-credentials: false
      - name: Package and install Atlas with IWXA Setup Core
        if: github.ref_name == 'work/2026-11-09-atlas-0-5' || github.ref_name == 'work/2026-11-10-atlas-0-6'
        shell: pwsh
        timeout-minutes: 8
        run: ./desktop/installer/build-setup-core.ps1 -InstallForQualification
      - name: Run native regression tests
        shell: pwsh
        run: cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Native Atlas R5 120-project persistence and 20 incremental revisions
        if: github.ref_name == 'work/2026-11-04-atlas-0-3' || github.ref_name == 'work/2026-11-08-atlas-0-4' || github.ref_name == 'release/0.4' || github.ref_name == 'work/2026-11-09-atlas-0-5' || github.ref_name == 'work/2026-11-10-atlas-0-6'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'atlas-r5-portfolio-120.json'
          node tests/fixtures/desktop-portfolio-120.mjs | Set-Content -LiteralPath $fixture -Encoding utf8
          $env:ATLAS_R5_PORTFOLIO_JSON = $fixture
          "ATLAS_R5_PORTFOLIO_JSON=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --lib persistence_tests::native_r5_scale_and_incremental_readback -- --exact --nocapture
      - name: Verify first-use connection on installed Atlas 0.6 Windows
        if: github.ref_name == 'work/2026-11-10-atlas-0-6'
        shell: pwsh
        timeout-minutes: 9
        run: |
          python -m pip install pywinauto==0.6.9 pillow==11.3.0
          python -m py_compile desktop/tests/installed-atlas06-connect.py
          python desktop/tests/installed-atlas06-connect.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS06_INSTALLED_CONNECT_FAILED' }
      - name: Build Atlas 0.6 synthetic visual stress archive
        if: github.ref_name == 'work/2026-11-10-atlas-0-6'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'atlas06-visual-portfolio.iwxa'
          node tests/fixtures/atlas06-visual-portfolio.mjs $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $archive)) { throw 'ATLAS06_VISUAL_FIXTURE_FAILED' }
          "ATLAS06_VISUAL_IWXA=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Qualify large Atlas 0.6 map in installed Windows GUI
        if: github.ref_name == 'work/2026-11-10-atlas-0-6'
        shell: pwsh
        timeout-minutes: 8
        run: |
          python -m py_compile desktop/tests/installed-atlas06-visual-scale.py
          python desktop/tests/installed-atlas06-visual-scale.py
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS06_INSTALLED_VISUAL_SCALE_FAILED' }
      - name: Install legacy NSIS candidate, verify executable and icon
        if: github.ref_name != 'work/2026-11-09-atlas-0-5' && github.ref_name != 'work/2026-11-10-atlas-0-6'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedVersion = if ($env:GITHUB_REF_NAME -eq 'work/2026-11-09-atlas-0-5') { '0.5.0-dev.1' } elseif ($env:GITHUB_REF_NAME -eq 'release/0.4') { '0.4.0' } elseif ($env:GITHUB_REF_NAME -eq 'work/2026-11-08-atlas-0-4') { '0.4.0-dev.1' } elseif ($env:GITHUB_REF_NAME -eq 'work/2026-11-04-atlas-0-3') { '0.3.0' } else { '0.2.1' }
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Filter "*$expectedVersion*setup.exe" | Select-Object -First 1
          if (!$installer) { throw 'Expected version NSIS installer missing' }
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          $p | Wait-Process -Timeout 90 -ErrorAction Stop
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "NSIS exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'IWXA Atlas\iwxa-atlas-desktop.exe'
          if (!(Test-Path $exe)) { throw "Installed EXE missing: $exe" }
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (!$ico) { throw 'Missing Windows EXE icon' }
          $bmp = $ico.ToBitmap()
          $pixel = $bmp.GetPixel([int]($bmp.Width * 0.36),[int]($bmp.Height * 0.50))
          if (([math]::Abs($pixel.R-63) -gt 25) -or ([math]::Abs($pixel.G-150) -gt 25) -or ([math]::Abs($pixel.B-237) -gt 25)) {
            throw "Installed EXE has unexpected icon RGB=$($pixel.R),$($pixel.G),$($pixel.B)"
          }
          "ATLAS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'ATLAS_INSTALLED_ICON_PASS'
      - name: Regression installed GUI save and restart
        if: github.ref_name != 'work/2026-11-08-atlas-0-4' && github.ref_name != 'release/0.4' && github.ref_name != 'work/2026-11-09-atlas-0-5' && github.ref_name != 'work/2026-11-10-atlas-0-6'
        shell: pwsh
        timeout-minutes: 5
        run: ./desktop/tests/installed-windows-keyboard.ps1
      - name: Qualify Atlas 0.4/0.5 installed GUI and full restart
        if: github.ref_name == 'work/2026-11-08-atlas-0-4' || github.ref_name == 'release/0.4' || github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        timeout-minutes: 6
        run: ./desktop/tests/installed-atlas04-ux.ps1
      - name: Install existing Windows GUI test driver for the large-portfolio import
        if: github.ref_name == 'work/2026-11-08-atlas-0-4' || github.ref_name == 'release/0.4' || github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        run: |
          python -m pip install pywinauto==0.6.9 pillow==11.3.0
          python -m py_compile desktop/tests/installed-atlas04-scale.py
      - name: Measure real 120-project / 1200-work installed Atlas 0.4/0.5 UI
        if: github.ref_name == 'work/2026-11-08-atlas-0-4' || github.ref_name == 'release/0.4' || github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        timeout-minutes: 8
        run: python desktop/tests/installed-atlas04-scale.py
      - name: Exercise native Atlas 0.5 IWXA Save As and safe import preview
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        timeout-minutes: 6
        run: python desktop/tests/installed-atlas05-iwxa.py
      - name: Retain installed Atlas IWXA consumer qualification sample
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'atlas05-human-portfolio.iwxa'
          if (!(Test-Path -LiteralPath $source)) { throw 'Installed IWXA export fixture was not created' }
          $directory = Join-Path $env:RUNNER_TEMP 'atlas05-iwxa-consumer-sample'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $package = Join-Path $directory 'atlas05-synthetic-portfolio.iwxa'
          Copy-Item -LiteralPath $source -Destination $package -ErrorAction Stop
          python desktop/tests/atlas05-consumer-receipt.py $package (Join-Path $directory 'RECEIPT.txt') $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'IWXA consumer sample receipt verification failed' }
      - name: Publish synthetic Atlas IWXA consumer sample for independent import tests
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        uses: actions/upload-artifact@v4
        with:
          name: atlas05-iwxa-consumer-sample
          path: ${{ runner.temp }}/atlas05-iwxa-consumer-sample/*
          if-no-files-found: error
          retention-days: 7
      - name: Checkout exact public Center 0.3 read-only consumer
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 0fad3fb13245b87fefc54ddc5fdf3835004d23c0
          path: center-public
          persist-credentials: false
      - name: Checkout Center-pinned canonical Atlas source (no fork)
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 0de3b6058526021aeecee6f445acf89b956d10c9
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Install Center-pinned IWXA reader for installed archive verification
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        working-directory: center-public/vendor/atlas/desktop
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Read installed Atlas IWXA in actual Center 0.3 source consumer
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        timeout-minutes: 3
        run: node tests/atlas05-center-iwxa-consumer.mjs "$env:RUNNER_TEMP/atlas05-human-portfolio.iwxa"
      - name: Exercise installed Atlas 0.5 GitHub Actions selected-branch roundtrip
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        timeout-minutes: 6
        run: |
          python -m py_compile desktop/tests/installed-atlas05-github.py
          python desktop/tests/installed-atlas05-github.py
      - name: Qualify selected Atlas data location, native GUI and preserved uninstall
        if: github.ref_name == 'work/2026-11-09-atlas-0-5'
        shell: pwsh
        timeout-minutes: 8
        run: ./desktop/installer/qualify-setup-core-lifecycle.ps1
      - name: Checkout real Center consumer at audited revision
        if: github.ref_name == 'work/2026-11-04-atlas-0-3'
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 164c67849d709f6fae2f39666d6870d37fe12670
          path: center-public
          persist-credentials: false
      - name: Checkout exact canonical Atlas core used by Center
        if: github.ref_name == 'work/2026-11-04-atlas-0-3'
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Import actual installed GUI JSON using real Center source
        if: github.ref_name == 'work/2026-11-04-atlas-0-3'
        shell: pwsh
        run: node tests/installed-center-export.mjs
      - name: Build existing Center offline Windows installer for two-app GUI test
        if: github.ref_name == 'work/2026-11-04-atlas-0-3'
        working-directory: center-public
        shell: pwsh
        timeout-minutes: 14
        run: |
          npm install --no-audit --no-fund
          npm run desktop:build
      - name: Qualify two installed applications and stale WorkRef in real Center GUI
        if: github.ref_name == 'work/2026-11-04-atlas-0-3'
        shell: pwsh
        timeout-minutes: 7
        run: ./desktop/tests/installed-center-e2e.ps1
      - name: Retain installed GUI screenshot evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-installed-gui-evidence
          path: desktop/tests/visual-evidence/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Retain candidate installer (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-installer-qualification-candidate
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            artifacts/IWXA-Atlas-0.5.0-Setup.exe
            artifacts/IWXA-Atlas-0.5.0-Setup.exe.sha256
            artifacts/IWXA-Atlas-0.6.0-dev.1-Setup.exe
            artifacts/IWXA-Atlas-0.6.0-dev.1-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish Atlas 0.4.0 stable release after Windows acceptance
        if: github.ref == 'refs/heads/release/0.4' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release-0.4]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Filter '*0.4.0_x64-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Stable NSIS installer was not built' }
          gh release view v0.4.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release v0.4.0 already exists; refusing overwrite' }
          $sumfile = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($sumfile, "$checksum *$($installer.Name)`n", [System.Text.UTF8Encoding]::new($false))
          gh release create v0.4.0 "$($installer.FullName)" "$sumfile" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'IWXA Atlas 0.4.0' --notes 'Windows x64 stable release based on the accepted Atlas 0.4 candidate. Installed Tauri/NSIS, native persistence, 120 projects / 1200 works, and strict installed GUI routes are qualified. New UX copy, unified .iwxa exchange and expanded GitHub connectivity belong to Atlas 0.5.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          Write-Output "ATLAS04_STABLE_RELEASE_PUBLISHED sha=$env:GITHUB_SHA checksum=$checksum"

      - name: Publish Atlas 0.5.0 after installed Windows acceptance
        if: github.ref == 'refs/heads/work/2026-11-09-atlas-0-5' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release-0.5]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item -LiteralPath 'artifacts/IWXA-Atlas-0.5.0-Setup.exe' -ErrorAction Stop
          $sumfile = Get-Item -LiteralPath 'artifacts/IWXA-Atlas-0.5.0-Setup.exe.sha256' -ErrorAction Stop
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content -LiteralPath $sumfile.FullName -Raw).Trim().Split(' ')[0]).ToLowerInvariant()
          if ($actual -ne $expected) { throw 'ATLAS05_RELEASE_CHECKSUM_MISMATCH' }
          gh release view v0.5.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'ATLAS05_RELEASE_ALREADY_EXISTS' }
          $notes = 'IWXA Atlas 0.5.0: Windows x64. Installation via IWXA Setup Core, selected data folders, safe uninstall, .iwxa exchange, GitHub/Actions observations and Plan / fact. Existing NSIS installations remain intact until an explicit legacy transition. Authenticode publisher signature is not included.'
          gh release create v0.5.0 "$($installer.FullName)" "$($sumfile.FullName)" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'IWXA Atlas 0.5.0' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS05_RELEASE_PUBLICATION_FAILED' }
          Write-Output "ATLAS05_STABLE_RELEASE_PUBLISHED sha=$env:GITHUB_SHA checksum=$actual"
