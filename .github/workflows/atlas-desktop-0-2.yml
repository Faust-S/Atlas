name: IWXA Atlas 0.2 desktop build qualification

on:
  push:
    branches:
      - work/2026-11-02-atlas-desktop-0.2
    paths:
      # Documentation-only desktop commits must not cancel an ongoing
      # Windows installer qualification via concurrency.cancel-in-progress.
      - 'desktop/src/**'
      - 'desktop/src-tauri/**'
      - 'desktop/tests/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/index.html'
      - 'desktop/vite.config.*'
      - 'desktop/tsconfig*.json'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/atlas-desktop-0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-desktop-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One-shot R6.5 migration: generate genuine lockfiles using npm and Cargo
  # on a hosted runner, then commit the two resolved manifests to THIS branch.
  # Never fabricate lockfile versions or modify main/release branches.
  dependency-locks:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[generate-locks]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact npm lockfile from package manifest
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve exact Cargo lockfile from current Rust manifest
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Verify npm and Cargo can read their lockfiles
        run: |
          node -e "const a=require('./desktop/package-lock.json');if(a.name!=='iwxa-atlas-desktop'||!a.packages)throw Error('Invalid npm lock')"
          cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Commit resolved dependency versions to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "ATLAS_LOCKFILES_ALREADY_PINNED"
          else
            git commit -m "chore(R6): pin npm and Cargo dependencies [desktop-accept]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "ATLAS_LOCKFILES_COMMITTED"
          fi

  frontend:
    # Every changed desktop/core revision must run the real Node/Vite suite.
    # The expensive installed Windows GUI gate remains opt-in per SHA.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve existing domain core
        run: npm test
      - name: Checkout frozen Atlas 0.1 for a genuine migration source
        uses: actions/checkout@v4
        with:
          ref: addee450b8d80f8fad1fcb9af8e8d13dc1824151
          path: legacy-01
      - name: Create JSON using actual 0.1 source code
        run: node tests/generate-release-01-archive.mjs legacy-01 "${{ runner.temp }}/atlas-legacy-0-1.json"
      - name: Verify lossless migration using current 0.2 validator and adapter
        env:
          ATLAS_LEGACY_ARCHIVE: ${{ runner.temp }}/atlas-legacy-0-1.json
        run: node tests/qualify-release-01-archive.mjs
      - name: Install desktop UI dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Compile React TypeScript and Vite
        working-directory: desktop
        run: npm run build

      - name: Check compiled frontend with installed Chrome (no extra test dependency)
        working-directory: desktop
        run: node tests/frontend-runtime.mjs

  native-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-accept]')
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Compile desktop and create native Windows installer
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run desktop:build
      - name: Verify native on-disk transaction and recovery tests
        shell: pwsh
        run: cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Build deterministic large-portfolio JSON from existing Atlas fixture
        shell: pwsh
        run: |
          node tests/fixtures/desktop-portfolio-120.mjs | Out-File -FilePath "$env:RUNNER_TEMP\\atlas-r5.json" -Encoding utf8
          if (!(Test-Path "$env:RUNNER_TEMP\\atlas-r5.json")) { throw 'R5 snapshot missing' }
          "ATLAS_R5_PORTFOLIO_JSON=$env:RUNNER_TEMP\\atlas-r5.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Qualify 120-project 20-edit native persistence workload
        shell: pwsh
        run: cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --lib native_r5_scale_and_incremental_readback -- --nocapture
      # Installing and exercising the exact NSIS package below already checks
      # the real window, React -> Rust IPC, save/readback and graceful exit.
      # Do not start an extra standalone process that can leave WebView2
      # descendants and interfere with the installed GUI session.
      - name: Install this exact Windows build using NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS output missing' }
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          try { $installerProcess | Wait-Process -Timeout 85 -ErrorAction Stop }
          catch {
            if (!$installerProcess.HasExited) { Stop-Process -Id $installerProcess.Id -Force -ErrorAction SilentlyContinue }
            throw 'NSIS installer timeout'
          }
          $installerProcess.Refresh()
          if ($installerProcess.ExitCode -ne 0) { throw "Installer returned $($installerProcess.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'IWXA Atlas\iwxa-atlas-desktop.exe'
          if (!(Test-Path $exe)) { throw "Installed app absent: $exe" }
          "ATLAS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "ATLAS_EXACT_REVISION_NSIS_INSTALL_PASS"
      - name: Retain built Windows installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 3
      # The next step already launches the installed EXE twice, checks
      # WebView2 -> Rust atlas_open, creates real projects and tests native
      # persistence and graceful close. Avoid four redundant launches on a
      # limited hosted graphical session.
      - name: Exercise installed React forms save close and reopen using native keyboard input
        shell: pwsh
        timeout-minutes: 4
        run: ./desktop/tests/installed-windows-keyboard.ps1
      - name: Checkout frozen 0.1 source to make a real legacy GUI import archive
        uses: actions/checkout@v4
        with:
          ref: addee450b8d80f8fad1fcb9af8e8d13dc1824151
          path: legacy-01
      - name: Create authentic Atlas 0.1 JSON for installed import
        shell: pwsh
        run: |
          node tests/generate-release-01-archive.mjs legacy-01 "$env:RUNNER_TEMP\\atlas-legacy-0-1.json"
          "ATLAS_LEGACY_ARCHIVE=$env:RUNNER_TEMP\\atlas-legacy-0-1.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install independent Windows UI Automation driver for legacy file dialog
        shell: pwsh
        run: python -m pip install pywinauto==0.6.9 pillow==11.3.0
      - name: Check installed GUI import script syntax
        shell: pwsh
        run: python -m py_compile desktop/tests/installed-windows-import.py
      - name: Qualify installed legacy 0.1 import and 120-project GUI persistence/restart
        shell: pwsh
        timeout-minutes: 8
        run: python desktop/tests/installed-windows-import.py
      - name: Retain installed Gantt and DAG visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-installed-gantt-dag
          path: desktop/tests/visual-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
      # Native keyboard interaction is a different hypothesis from UIA/CDP.
      # This is a GUI acceptance attempt, not a release PASS until the logs
      # prove both installed processes committed and reread the same project.

