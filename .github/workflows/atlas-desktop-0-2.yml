name: IWXA Atlas 0.2 desktop frontend qualification

on:
  push:
    branches:
      - work/2026-11-02-atlas-desktop-0.2
    paths:
      - 'desktop/**'
      - 'src/**'
      - '.github/workflows/atlas-desktop-0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-desktop-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[desktop-accept]') || contains(github.event.head_commit.message, '[windows-accept]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve existing domain core
        run: npm test
      - name: Install desktop UI dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Compile React TypeScript and Vite
        working-directory: desktop
        run: npm run build

  native-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-accept]')
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Compile desktop and create native Windows installer
        shell: pwsh
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run desktop:build
      - name: Verify native on-disk transaction and recovery tests
        shell: pwsh
        run: cargo test --release --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Exercise native WebView2 project save and restart
        shell: pwsh
        run: node desktop/tests/native-window-cdp.mjs
      - name: Preserve native desktop visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-0-2-native-webview2-screenshots
          path: desktop/test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain installer only when build succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 3
