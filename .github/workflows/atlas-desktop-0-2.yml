name: IWXA Atlas 0.2 desktop build qualification

on:
  push:
    branches:
      - work/2026-11-02-atlas-desktop-0.2
      - work/2026-11-04-atlas-0-2-postrelease
    paths:
      # Documentation-only desktop commits must not cancel an ongoing
      # Windows installer qualification via concurrency.cancel-in-progress.
      - 'desktop/src/**'
      - 'desktop/src-tauri/**'
      - 'desktop/tests/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop/index.html'
      - 'desktop/vite.config.*'
      - 'desktop/tsconfig*.json'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/atlas-desktop-0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-desktop-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One-shot R6.5 migration: generate genuine lockfiles using npm and Cargo
  # on a hosted runner, then commit the two resolved manifests to THIS branch.
  # Never fabricate lockfile versions or modify main/release branches.
  dependency-locks:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[generate-locks]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact npm lockfile from package manifest
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve exact Cargo lockfile from current Rust manifest
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Verify npm and Cargo can read their lockfiles
        run: |
          node -e "const a=require('./desktop/package-lock.json');if(a.name!=='iwxa-atlas-desktop'||!a.packages)throw Error('Invalid npm lock')"
          cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Commit resolved dependency versions to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "ATLAS_LOCKFILES_ALREADY_PINNED"
          else
            git commit -m "chore(R6): pin npm and Cargo dependencies [desktop-accept]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "ATLAS_LOCKFILES_COMMITTED"
          fi

  frontend:
    # Every changed desktop/core revision must run the real Node/Vite suite.
    # The expensive installed Windows GUI gate remains opt-in per SHA.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve existing domain core
        run: npm test
      - name: Checkout frozen Atlas 0.1 for a genuine migration source
        uses: actions/checkout@v4
        with:
          ref: addee450b8d80f8fad1fcb9af8e8d13dc1824151
          path: legacy-01
      - name: Create JSON using actual 0.1 source code
        run: node tests/generate-release-01-archive.mjs legacy-01 "${{ runner.temp }}/atlas-legacy-0-1.json"
      - name: Verify lossless migration using current 0.2 validator and adapter
        env:
          ATLAS_LEGACY_ARCHIVE: ${{ runner.temp }}/atlas-legacy-0-1.json
        run: node tests/qualify-release-01-archive.mjs
      - name: Install desktop UI dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Compile React TypeScript and Vite
        working-directory: desktop
        run: npm run build

      - name: Check compiled frontend with installed Chrome (no extra test dependency)
        working-directory: desktop
        run: node tests/frontend-runtime.mjs

  native-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-accept]')
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Compile desktop and create native Windows installer
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run desktop:build
      - name: Verify native on-disk transaction and recovery tests
        shell: pwsh
        run: cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Build deterministic large-portfolio JSON from existing Atlas fixture
        shell: pwsh
        run: |
          node tests/fixtures/desktop-portfolio-120.mjs | Out-File -FilePath "$env:RUNNER_TEMP\\atlas-r5.json" -Encoding utf8
          if (!(Test-Path "$env:RUNNER_TEMP\\atlas-r5.json")) { throw 'R5 snapshot missing' }
          "ATLAS_R5_PORTFOLIO_JSON=$env:RUNNER_TEMP\\atlas-r5.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate existing domain route for installed GUI human-review scenario
        shell: pwsh
        run: |
          node tests/fixtures/desktop-release-route.mjs | Out-File -FilePath "$env:RUNNER_TEMP\\atlas-release-route.json" -Encoding utf8
          "ATLAS_GUI_ROUTE_JSON=$env:RUNNER_TEMP\\atlas-release-route.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Qualify 120-project 20-edit native persistence workload
        shell: pwsh
        run: cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --lib native_r5_scale_and_incremental_readback -- --nocapture
      # Installing and exercising the exact NSIS package below already checks
      # the real window, React -> Rust IPC, save/readback and graceful exit.
      # Do not start an extra standalone process that can leave WebView2
      # descendants and interfere with the installed GUI session.
      - name: Install this exact Windows build using NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS output missing' }
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          try { $installerProcess | Wait-Process -Timeout 85 -ErrorAction Stop }
          catch {
            if (!$installerProcess.HasExited) { Stop-Process -Id $installerProcess.Id -Force -ErrorAction SilentlyContinue }
            throw 'NSIS installer timeout'
          }
          $installerProcess.Refresh()
          if ($installerProcess.ExitCode -ne 0) { throw "Installer returned $($installerProcess.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'IWXA Atlas\iwxa-atlas-desktop.exe'
          if (!(Test-Path $exe)) { throw "Installed app absent: $exe" }
          "ATLAS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "ATLAS_EXACT_REVISION_NSIS_INSTALL_PASS"
      - name: Retain built Windows installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 3
      # The next step already launches the installed EXE twice, checks
      # WebView2 -> Rust atlas_open, creates real projects and tests native
      # persistence and graceful close. Avoid four redundant launches on a
      # limited hosted graphical session.
      - name: Exercise installed React forms save close and reopen using native keyboard input
        shell: pwsh
        timeout-minutes: 4
        run: ./desktop/tests/installed-windows-keyboard.ps1
      - name: Checkout frozen 0.1 source to make a real legacy GUI import archive
        uses: actions/checkout@v4
        with:
          ref: addee450b8d80f8fad1fcb9af8e8d13dc1824151
          path: legacy-01
      - name: Create authentic Atlas 0.1 JSON for installed import
        shell: pwsh
        run: |
          node tests/generate-release-01-archive.mjs legacy-01 "$env:RUNNER_TEMP\\atlas-legacy-0-1.json"
          "ATLAS_LEGACY_ARCHIVE=$env:RUNNER_TEMP\\atlas-legacy-0-1.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install independent Windows UI Automation driver for legacy file dialog
        shell: pwsh
        run: python -m pip install pywinauto==0.6.9 pillow==11.3.0
      - name: Check installed GUI import script syntax
        shell: pwsh
        run: python -m py_compile desktop/tests/installed-windows-import.py
      - name: Qualify installed legacy import, R5, backup/restore and human planning workflow
        shell: pwsh
        timeout-minutes: 12
        run: python desktop/tests/installed-windows-import.py
      - name: Retain installed Gantt and DAG visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-installed-gantt-dag
          path: desktop/tests/visual-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
      # Native keyboard interaction is a different hypothesis from UIA/CDP.
      # This is a GUI acceptance attempt, not a release PASS until the logs
      # prove both installed processes committed and reread the same project.


  # Release exactly the same immutable SHA and NSIS artifact qualified above.
  # This runs ONLY when the final candidate commit carries [release-final].
  publish-0-2-0:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-final]')
    needs: [frontend, native-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout qualified final SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up release metadata Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact NSIS package from this qualifying run
        uses: actions/download-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          path: release-assets
      - name: Verify immutable release identity and calculate SHA-256
        id: verify-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/2026-11-02-atlas-desktop-0.2"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e 'for(const [path,expected] of [["./desktop/package.json","0.2.0"],["./desktop/src-tauri/tauri.conf.json","0.2.0"]]) {let v=require(path).version;if(v!==expected)throw Error(path+": "+v)}'
          grep -q '^version = "0.2.0"$' desktop/src-tauri/Cargo.toml
          test -f docs/ATLAS_0_2_0_RELEASE_GATES_RU.md
          test -f docs/ATLAS_0_2_0_RELEASE_NOTES_RU.md
          if git ls-remote --exit-code --heads origin release/0.2 >/dev/null; then
            echo "release/0.2 already exists; never overwrite" >&2; exit 1
          fi
          if git ls-remote --exit-code --tags origin v0.2.0 >/dev/null; then
            echo "v0.2.0 already exists; never overwrite" >&2; exit 1
          fi
          mapfile -d '' packages < <(find release-assets -type f -name '*0.2.0*setup.exe' -print0)
          test "${#packages[@]}" -eq 1
          installer="${packages[0]}"
          test -s "$installer"
          sha256sum "$installer" | sed 's#  release-assets/#  #' > SHA256SUMS.txt
          echo "ATLAS_RELEASE_INSTALLER=$(basename "$installer")"
          cat SHA256SUMS.txt
          cp docs/ATLAS_0_2_0_RELEASE_NOTES_RU.md RELEASE_BODY.md
          cat >> RELEASE_BODY.md <<'GATES'
          
          ## Матрица G01–G12 на едином релизном SHA
          
          Успех этого workflow означает, что frontend и native-windows завершились SUCCESS **на том же исходном коммите**, а все адресные установленные GUI-проверки возвратили код 0.
          
          | Gate | Результат и основание |
          |---|---|
          | G01 | PASS — Node, TypeScript/Vite, Rust |
          | G02 | PASS — сборка и установка настоящего NSIS |
          | G03 | PASS — автономный установленный WebView2/Tauri |
          | G04 | PASS — проект, работы, зависимости и базовый GUI |
          | G05 | PASS — native readback, закрытие и полный перезапуск |
          | G06 | PASS — настоящий JSON 0.1 через GUI |
          | G07 | PASS — внешний JSON backup через Windows picker |
          | G08 | PASS — история, восстановление и перезапуск |
          | G09 | PASS — CPM и взаимодействия Gantt/DAG, визуальные артефакты Windows |
          | G10 | PASS — 120 проектов, 1 200 работ, 300 + 40 зависимостей |
          | G11 | PASS — SHA/recheck → решение → proposal → approval → plan → save/restart через установленный GUI |
          | G12 | PASS — зафиксированные SHA/TREE, тег, release branch, NSIS и SHA-256, проверяемые в GitHub Release |
          
          Артефакты экранов и подробные квитанции — в Windows workflow, ссылка указана ниже.
          GATES
          {
            printf '\n## Независимые идентификаторы выпуска\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- TREE: `%s`\n' "$(git rev-parse HEAD^{tree})"
            printf -- '- Windows qualification: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- NSIS installer: `%s` (%s bytes)\n' "$(basename "$installer")" "$(stat -c %s "$installer")"
            printf -- '- Node: 22; Cargo MSVC build, Rust minimum version: %s\n' "$(grep '^rust-version' desktop/src-tauri/Cargo.toml | cut -d '"' -f2)"
            printf '\n## SHA-256\n\n```text\n'
            cat SHA256SUMS.txt
            printf '```\n'
          } >> RELEASE_BODY.md
      - name: Create immutable release branch, annotated tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "$GITHUB_SHA:refs/heads/release/0.2"
          git tag -a v0.2.0 "$GITHUB_SHA" -m "IWXA Atlas 0.2.0 — qualified Windows release"
          git push origin refs/tags/v0.2.0
          gh release create v0.2.0 release-assets/*0.2.0*setup.exe SHA256SUMS.txt \
            --verify-tag --title "IWXA Atlas 0.2.0 — Windows Desktop" \
            --notes-file RELEASE_BODY.md
          test "$(git ls-remote origin refs/heads/release/0.2 | cut -f1)" = "$GITHUB_SHA"
          gh release view v0.2.0 --json assets,url,tagName
          echo "ATLAS_0_2_RELEASE_PUBLISHED_PASS"

  # Post-release distribution metadata only. Does not rebuild or touch the
  # qualified installer, its tag, the release branch or any product source.
  repair-release-asset-name:
    if: github.event_name == 'push' && github.ref_name == 'work/2026-11-04-atlas-0-2-postrelease' && contains(github.event.head_commit.message, '[post-release-metadata]')
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Reconcile published installer name and SHA256SUMS without changing release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_COMMIT: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          EXPECTED_SHA256: e8a95178866ba9c6f8b0753f2c3e29e6ea59a73eda6baf467cefb0c5d9eb2ce5
        run: |
          set -euo pipefail
          tag_object=$(gh api "repos/$REPO/git/ref/tags/v0.2.0" --jq '.object.sha')
          tag_commit=$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.sha')
          release_commit=$(gh api "repos/$REPO/git/ref/heads/release/0.2" --jq '.object.sha')
          test "$tag_commit" = "$EXPECTED_COMMIT"
          test "$release_commit" = "$EXPECTED_COMMIT"
          installer=$(gh api "repos/$REPO/releases/tags/v0.2.0" --jq '.assets[] | select(.name | endswith("setup.exe")) | .name')
          test "$installer" = "IWXA.Atlas_0.2.0_x64-setup.exe"
          digest=$(gh api "repos/$REPO/releases/tags/v0.2.0" --jq '.assets[] | select(.name | endswith("setup.exe")) | .digest')
          test "$digest" = "sha256:$EXPECTED_SHA256"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$installer" > SHA256SUMS.txt
          gh release view v0.2.0 -R "$REPO" --json body --jq '.body' > RELEASE_BODY.md
          python3 -c 'from pathlib import Path; p=Path("RELEASE_BODY.md"); s=p.read_text(); old="IWXA Atlas_0.2.0_x64-setup.exe"; new="IWXA.Atlas_0.2.0_x64-setup.exe"; assert old in s; p.write_text(s.replace(old,new))'
          gh release upload v0.2.0 SHA256SUMS.txt -R "$REPO" --clobber
          gh release edit v0.2.0 -R "$REPO" --notes-file RELEASE_BODY.md
          mkdir -p verification
          gh release download v0.2.0 -R "$REPO" --pattern 'SHA256SUMS.txt' --dir verification
          cmp SHA256SUMS.txt verification/SHA256SUMS.txt
          grep -F "$installer" verification/SHA256SUMS.txt
          test "$(gh api "repos/$REPO/git/ref/heads/release/0.2" --jq '.object.sha')" = "$EXPECTED_COMMIT"
          test "$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.sha')" = "$EXPECTED_COMMIT"
          echo "ATLAS_0_2_0_RELEASE_METADATA_REPAIRED_PASS"
