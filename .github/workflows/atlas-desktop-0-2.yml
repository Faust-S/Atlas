name: IWXA Atlas 0.2 desktop build qualification

on:
  push:
    branches:
      - work/2026-11-02-atlas-desktop-0.2
    paths:
      - 'desktop/**'
      - 'src/**'
      - '.github/workflows/atlas-desktop-0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-desktop-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[desktop-accept]') || contains(github.event.head_commit.message, '[windows-accept]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve existing domain core
        run: npm test
      - name: Install desktop UI dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Compile React TypeScript and Vite
        working-directory: desktop
        run: npm run build

      - name: Check compiled frontend with installed Chrome (no extra test dependency)
        working-directory: desktop
        run: node tests/frontend-runtime.mjs

  native-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-accept]')
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Compile desktop and create native Windows installer
        shell: pwsh
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run desktop:build
      - name: Verify native on-disk transaction and recovery tests
        shell: pwsh
        run: cargo test --release --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Launch standalone desktop window without development server
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/release/iwxa-atlas-desktop.exe"
          if (!(Test-Path $exe)) { throw "Desktop executable missing" }
          $process = Start-Process -FilePath (Resolve-Path $exe) -PassThru
          try {
            $opened = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Standalone Atlas exited unexpectedly: $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { $opened = $true; break }
            }
            if (!$opened) { throw "Native Atlas window did not appear" }
            Write-Output "ATLAS_DESKTOP_NATIVE_WINDOW_PASS PID=$($process.Id) Handle=$($process.MainWindowHandle)"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Install this exact Windows build using NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS output missing' }
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          try { $installerProcess | Wait-Process -Timeout 85 -ErrorAction Stop }
          catch {
            if (!$installerProcess.HasExited) { Stop-Process -Id $installerProcess.Id -Force -ErrorAction SilentlyContinue }
            throw 'NSIS installer timeout'
          }
          $installerProcess.Refresh()
          if ($installerProcess.ExitCode -ne 0) { throw "Installer returned $($installerProcess.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'IWXA Atlas\iwxa-atlas-desktop.exe'
          if (!(Test-Path $exe)) { throw "Installed app absent: $exe" }
          "ATLAS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "ATLAS_EXACT_REVISION_NSIS_INSTALL_PASS"
      - name: Retain built Windows installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-atlas-0-2-windows-nsis-candidate
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 3
      # The next step already launches the installed EXE twice, checks
      # WebView2 -> Rust atlas_open, creates real projects and tests native
      # persistence and graceful close. Avoid four redundant launches on a
      # limited hosted graphical session.
      - name: Exercise installed React forms save close and reopen using native keyboard input
        shell: pwsh
        timeout-minutes: 4
        run: ./desktop/tests/installed-windows-keyboard.ps1
      # Native keyboard interaction is a different hypothesis from UIA/CDP.
      # This is a GUI acceptance attempt, not a release PASS until the logs
      # prove both installed processes committed and reread the same project.

