name: Atlas tests and desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-04-atlas-0-3
      - work/2026-11-08-atlas-0-4
    paths:
      - 'src/**'
      - 'tests/**'
      - 'desktop/src/**'
      - 'desktop/public/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/manual-check.yml'

permissions:
  contents: read

concurrency:
  group: atlas03-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Atlas and new 0.3 regression suite
        run: npm test
      - name: Validate source syntax
        run: |
          node --check src/app.mjs
          node --check src/project-host-port.mjs
      - name: Checkout actual public Admin Center contract at audited revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 52229f4e9f0d41ff835bad3e9f1f722a84599ff8
          path: center-public
          persist-credentials: false
      - name: Checkout canonical Atlas core pinned by Center
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Qualify Atlas project/work and stale revision with real Center sources
        run: node tests/atlas-center-interop.mjs
      - name: Install pinned desktop frontend
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Verify production desktop build
        working-directory: desktop
        run: npm run build

  # One-time publication of a byte-identical, independently qualified 0.3.0
  # installer. This job does not rebuild or move the frozen release/0.3 ref.
  publish-atlas03:
    if: github.event_name == 'push' && github.ref_name == 'work/2026-11-08-atlas-0-4' && contains(github.event.head_commit.message, '[atlas03-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download and verify exact frozen 0.3.0 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_head=594c1de8349c24941583c3afda382ec285e0aa0e
          expected_sha=c0963911f5fd0ae60c9405e29cb0ab69a1d5bc3f55c683841e4c219b00d98e3c
          pinned=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/0.3" --jq .object.sha)
          test "$pinned" = "$expected_head"
          if gh release view v0.3.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.0 already exists; do not replace any release assets"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/atlas03-source" "$RUNNER_TEMP/atlas03-release"
          gh run download 42482276398 -R "$GITHUB_REPOSITORY" --name iwxa-atlas-nsis-qualification-candidate -D "$RUNNER_TEMP/atlas03-source"
          source_file="$RUNNER_TEMP/atlas03-source/IWXA Atlas_0.3.0_x64-setup.exe"
          test -f "$source_file"
          test "$(stat -c %s "$source_file")" -eq 2112998
          actual_sha=$(sha256sum "$source_file" | cut -d ' ' -f 1)
          test "$actual_sha" = "$expected_sha"
          cp "$source_file" "$RUNNER_TEMP/atlas03-release/IWXA.Atlas_0.3.0_x64-setup.exe"
          printf '%s  %s\n' "$expected_sha" 'IWXA.Atlas_0.3.0_x64-setup.exe' > "$RUNNER_TEMP/atlas03-release/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/atlas03-release" && sha256sum -c SHA256SUMS.txt)
          gh release create v0.3.0 \
            "$RUNNER_TEMP/atlas03-release/IWXA.Atlas_0.3.0_x64-setup.exe" \
            "$RUNNER_TEMP/atlas03-release/SHA256SUMS.txt" \
            -R "$GITHUB_REPOSITORY" --target "$expected_head" \
            --title "IWXA Atlas 0.3.0 — Windows Desktop" \
            --notes "Stable Windows desktop installer. Exact source: $expected_head. Qualified in Actions run 42482276398 (NSIS, installed save/restart, real Atlas-to-Center JSON and stale WorkRef). The binary is byte-for-byte identical to the qualified artifact."
          gh release view v0.3.0 -R "$GITHUB_REPOSITORY" --json tagName,assets --jq '{tagName,assets:[.assets[].name]}'
