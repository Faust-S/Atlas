name: Atlas tests and desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-04-atlas-0-3
      - work/2026-11-05-atlas-k01-context-host
    paths:
      - 'src/**'
      - 'tests/**'
      - 'desktop/src/**'
      - 'desktop/public/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/manual-check.yml'

permissions:
  contents: read

concurrency:
  group: atlas03-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k01-generate-lock-once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[k01-lock]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve locked K01 Git dependency from its pinned public commit
        working-directory: desktop
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit exact npm-generated lockfile in this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "ATLAS_K01_LOCK_ALREADY_PINNED"
          else
            git commit -m "chore(atlas03-k01): pin npm-generated K01 dependency lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
  unit-tests:
    if: ${{ !contains(github.event.head_commit.message, '[k01-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned public K01 implementation
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 217debaad8a17b19b7ef883eca07dccc045ec9a8
          path: k01-public
          persist-credentials: false
          sparse-checkout: |
            package.json
            modules/k01-context
      - name: Install K01 host-only dependency for integration test
        working-directory: k01-public
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run real K01 and Atlas host integration
        run: node tests/k01-real-consumer.test.mjs
      - name: Install pinned desktop frontend and K01 dependency
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Existing Atlas and new 0.3 regression suite
        run: npm test
      - name: Validate source syntax
        run: |
          node --check src/app.mjs
          node --check src/project-host-port.mjs
      - name: Checkout actual public Admin Center contract at audited revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 52229f4e9f0d41ff835bad3e9f1f722a84599ff8
          path: center-public
          persist-credentials: false
      - name: Checkout canonical Atlas core pinned by Center
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Qualify Atlas project/work and stale revision with real Center sources
        run: node tests/atlas-center-interop.mjs
      - name: Verify production desktop build
        working-directory: desktop
        run: npm run build
      - name: Verify packaged K01 module is present in compiled WebView assets
        run: node desktop/tests/k01-webview-bundle.mjs
