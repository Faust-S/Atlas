name: Atlas tests and desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-04-atlas-0-3
      - work/2026-11-08-atlas-0-4
      - work/2026-11-09-atlas-0-5
      - work/2026-11-10-atlas-0-6
      - work/2026-11-10-atlas-person-license-consumer
    paths:
      - 'src/**'
      - 'tests/**'
      - 'desktop/src/**'
      - 'desktop/src-tauri/**'
      - 'desktop/installer/**'
      - 'desktop/public/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/manual-check.yml'

permissions:
  contents: read

concurrency:
  group: atlas03-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned desktop frontend
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Existing Atlas and new 0.3 regression suite
        run: npm test
      - name: Independently read Atlas IWXA 1.0 ZIP carrier with Python
        run: node tests/iwxa-python-carrier.mjs
      - name: Validate source syntax
        run: |
          node --check src/app.mjs
          node --check src/project-host-port.mjs
      - name: Checkout actual public Admin Center contract at audited revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 52229f4e9f0d41ff835bad3e9f1f722a84599ff8
          path: center-public
          persist-credentials: false
      - name: Checkout canonical Atlas core pinned by Center
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Qualify Atlas project/work and stale revision with real Center sources
        run: node tests/atlas-center-interop.mjs
      - name: Verify production desktop build
        working-directory: desktop
        run: npm run build

  person-windows-compile:
    if: github.ref_name == 'work/2026-11-10-atlas-person-license-consumer'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile Atlas 0.6 PERSON frontend and public native T3 bridge
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_PERSON_FRONTEND_BUILD_FAILED' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib person_license::tests::bridge_never_accepts_unbounded_identity_or_unsigned_receipts -- --exact
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_PERSON_NATIVE_BRIDGE_FAILED' }
      - name: Original private T3 consumer is never embedded in public CI
        shell: pwsh
        run: |
          if (Test-Path desktop/src-tauri/private-t3) { throw 'ATLAS_PERSON_PRIVATE_T3_IN_PUBLIC_CI' }
          Write-Host 'ATLAS_PERSON_PUBLIC_TRANSPORT_ONLY_PASS'
