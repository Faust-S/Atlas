name: Atlas tests and desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-04-atlas-0-3
      - work/2026-11-05-atlas-k01-context-host
    paths:
      - 'src/**'
      - 'tests/**'
      - 'desktop/src/**'
      - 'desktop/tests/**'
      - 'desktop/public/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/manual-check.yml'

permissions:
  contents: read

concurrency:
  group: atlas03-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k01-generate-lock-once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[k01-lock]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve locked K01 Git dependency from its pinned public commit
        working-directory: desktop
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit exact npm-generated lockfile in this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "ATLAS_K01_LOCK_ALREADY_PINNED"
          else
            git commit -m "chore(atlas03-k01): pin npm-generated K01 dependency lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
  unit-tests:
    if: ${{ !contains(github.event.head_commit.message, '[k01-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned public K01 implementation
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 217debaad8a17b19b7ef883eca07dccc045ec9a8
          path: k01-public
          persist-credentials: false
          sparse-checkout: |
            package.json
            modules/k01-context
      - name: Install K01 host-only dependency for integration test
        working-directory: k01-public
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run real K01 and Atlas host integration
        run: node tests/k01-real-consumer.test.mjs
      - name: Install pinned desktop frontend and K01 dependency
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Existing Atlas and new 0.3 regression suite
        run: npm test
      - name: Validate source syntax
        run: |
          node --check src/app.mjs
          node --check src/project-host-port.mjs
      - name: Checkout actual public Admin Center contract at audited revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 52229f4e9f0d41ff835bad3e9f1f722a84599ff8
          path: center-public
          persist-credentials: false
      - name: Checkout canonical Atlas core pinned by Center
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Qualify Atlas project/work and stale revision with real Center sources
        run: node tests/atlas-center-interop.mjs
      - name: Verify production desktop build
        working-directory: desktop
        run: npm run build
      - name: Verify packaged K01 module is present in compiled WebView assets
        run: node desktop/tests/k01-webview-bundle.mjs

  # Opt-in real installed Windows acceptance on this K01 feature branch only.
  # Reuses the existing Atlas 0.3 workflow and is gated by the tested Linux SHA.
  native-k01-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[k01-windows]')
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact K01-enabled Windows NSIS package
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run desktop:build
      - name: Install this exact NSIS package on the hosted Windows desktop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Atlas K01 NSIS installer is missing' }
          $p=Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          try { $p | Wait-Process -Timeout 95 -ErrorAction Stop }
          catch {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            throw 'Atlas K01 NSIS silent installation exceeded timeout'
          }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "Atlas NSIS installer exit code $($p.ExitCode)" }
          $exe=Join-Path $env:LOCALAPPDATA 'IWXA Atlas\iwxa-atlas-desktop.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw "Atlas K01 installed executable missing: $exe" }
          "ATLAS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'ATLAS_K01_INSTALLED_NSIS_PASS'
      - name: Install existing Windows GUI automation dependencies
        shell: pwsh
        run: python -m pip install pywinauto==0.6.9 pillow==11.3.0
      - name: Check Windows K01 GUI acceptance driver syntax
        shell: pwsh
        run: python -m py_compile desktop/tests/installed-windows-k01.py
      - name: Exercise installed K01 GUI with public GitHub and cold restart
        shell: pwsh
        timeout-minutes: 12
        run: python desktop/tests/installed-windows-k01.py
      - name: Retain installed K01 GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas03-k01-installed-windows-evidence
          path: desktop/tests/visual-evidence/installed-k01-*.png
          if-no-files-found: ignore
          retention-days: 3
