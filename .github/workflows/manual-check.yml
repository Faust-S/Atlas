name: Atlas tests and desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - work/2026-11-04-atlas-0-3
      - work/2026-11-08-atlas-0-4
      - work/2026-11-09-atlas-0-5
      - work/2026-11-10-atlas-0-6
      - release/0.6
      - release/0.7
      - release/0.8
      - release/0.10
      - work/2026-11-12-atlas-0-7
      - work/2026-11-14-atlas-0-8
      - work/2026-11-15-atlas08-t3-project-work-result
      - work/2026-11-16-atlas-0-9-t3
      - work/2026-11-22-atlas-0-10-calendar-scenario
    paths:
      - 'src/**'
      - 'tests/**'
      - 'desktop/src/**'
      - 'desktop/vite.config.ts'
      - 'desktop/index.html'
      - 'desktop/tests/**'
      - 'desktop/src-tauri/**'
      - 'desktop/installer/**'
      - 'desktop/public/**'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/manual-check.yml'

permissions:
  contents: read

concurrency:
  group: atlas03-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned desktop frontend
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Atlas 0.9 with original T3 and project regression suite
        run: npm test
      - name: Independently read Atlas IWXA 1.0 ZIP carrier with Python
        run: node tests/iwxa-python-carrier.mjs
      - name: Validate source syntax
        run: |
          node --check src/app.mjs
          node --check src/project-host-port.mjs
          node --check src/atlas-t3-native-recipient.mjs
      - name: Checkout current qualified original public T3 D6 and signed-source publisher
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          # D6's original blob is unchanged from 38ab0099. This revision
          # additionally contains the qualified ORIGINAL Agent-to-Atlas
          # native source publisher, never another Kernel or Exchange.
          ref: cb3843d887df1180c2f08ed8bb00c726e9b767a2
          path: t3-original
          persist-credentials: false
      - name: Qualify actual original T3 D6 with Atlas native recipient source
        env:
          ATLAS_T3_ORIGINAL_D6_MODULE: ${{ github.workspace }}/t3-original/packages/t3-core/src/t3/native-result-continuation.mjs
        run: node --test tests/atlas-t3-original-d6-qualification.mjs
      - name: Qualify original T3 native Agent source-publisher and exact Atlas port contract
        run: |
          node --check t3-original/packages/t3-core/src/t3/native-agent-atlas-source-publisher.mjs
          node --test t3-original/packages/t3-core/tests/t3-d6-native-agent-source-publisher.test.mjs
          node --test tests/atlas09-original-t3-sender-contract.mjs
      - name: Checkout actual public Admin Center contract at audited revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 52229f4e9f0d41ff835bad3e9f1f722a84599ff8
          path: center-public
          persist-credentials: false
      - name: Checkout canonical Atlas core pinned by Center
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: center-public/vendor/atlas
          persist-credentials: false
      - name: Qualify Atlas project/work and stale revision with real Center sources
        run: node tests/atlas-center-interop.mjs
      - name: Verify production desktop build
        working-directory: desktop
        run: npm run build
      - name: Confirm single dist includes importable signed T3 Host
        run: node tests/verify-atlas09-host-dist.mjs
