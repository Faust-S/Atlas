name: Atlas 0.12 baseline source and desktop qualification

on:
  push:
    branches:
      - work/2026-11-22-atlas-0-11-baseline
      - work/2026-11-23-atlas-0-12-plan-readiness
      - work/2026-11-24-atlas-calendar-performance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas11-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies used by IWXA carrier tests
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Validate all Atlas domain tests
        run: npm test
      - name: Check source syntax
        run: |
          for source in src/*.mjs; do node --check "$source"; done
          node --check tests/atlas11-baseline.test.mjs
      - name: Qualify installed-surface source and React build
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Archive exact source for independent qualification
        if: success()
        run: git archive --format=zip --output=atlas11-source.zip HEAD

      - name: Provide qualified source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas11-source-${{ github.sha }}
          path: atlas11-source.zip
          if-no-files-found: error
          retention-days: 3
