[package]
name = "iwxa-atlas-desktop"
version = "0.4.0"
description = "Local-first standalone IWXA Atlas"
edition = "2021"
rust-version = "1.90"

[lib]
name = "iwxa_atlas"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = { version = "=2.12.3" }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Storage_FileSystem"] }
